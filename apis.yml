aid: rayzebio
name: RayzeBio
description: >-
  RayzeBio is a clinical-stage radiopharmaceutical therapeutics company headquartered at 5505
  Morehouse Drive, Suite 300, San Diego, California, and since 2024 a wholly owned Bristol Myers
  Squibb company. It develops targeted radiopharmaceutical therapies (RPTs) built on the
  alpha-emitting isotope actinium-225, led by RYZ101 (225Ac-DOTATATE) against somatostatin
  receptor 2 (SSTR2)-expressing tumors including gastroenteropancreatic neuroendocrine tumors,
  extensive-stage small cell lung cancer and hormone-receptor-positive breast cancer, alongside
  earlier programs targeting glypican-3 (GPC3) in hepatocellular carcinoma and ACP3, plus paired
  diagnostic imaging agents such as [68Ga]Ga-RAYZ-8009. Its public web presence is a WordPress
  corporate marketing site covering discovery capabilities, radioisotope manufacturing, the
  pipeline, posters and presentations, leadership and careers; the company operates no developer
  program and publishes no API, SDK, or machine-readable specification, and is profiled here for
  network completeness rather than for an API surface.
